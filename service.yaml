apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: servicio-api-proyecto-regresion-kevin-inofuente
spec:
  template:
    spec:
      containerConcurrency: 80
      containers:
        - image: us-central1-docker.pkg.dev/datapath-mlops-kevin-inofuente/repositorio-mlops-inofuente/imagen-yolo26-mlops-inofuente:latest
          ports:
            - containerPort: 4010
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
